<!doctype html>
<html lang="en" data-theme="aurora" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Aurora Mind — an advanced, fully in-browser AI workspace: reasoning engine, document RAG, code lab, agent planner and four signature night modes."
    />
    <title>Aurora Mind · Advanced AI Workspace</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme bootstrap: runs before first paint so the night mode never flashes
      white on load. Reads the persisted theme and applies it to <html>.
    -->
    <script>
      (function () {
        try {
          var store = window.localStorage;
          var theme = store.getItem('am.theme') || 'aurora';
          if (theme === 'auto') {
            var h = new Date().getHours();
            theme = h >= 6 && h < 18 ? 'daylight' : 'aurora';
          }
          var valid = ['aurora', 'abyss', 'phosphor', 'eclipse', 'daylight'];
          if (valid.indexOf(theme) === -1) theme = 'aurora';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-night', theme === 'daylight' ? 'false' : 'true');
          var motion = store.getItem('am.motion');
          if (motion) root.setAttribute('data-motion', motion);
          var accent = store.getItem('am.accent');
          if (accent) root.style.setProperty('--accent', accent);
          var density = store.getItem('am.density');
          if (density) root.setAttribute('data-density', density);
        } catch (e) {
          /* storage blocked — fall back to defaults declared on <html> */
        }
      })();
    </script>

    <style>
      /* Pre-hydration splash so the first frame is already themed. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05060e;
      }
      html[data-theme='daylight'] body {
        background: #f4f6fb;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 18px;
        font-family: 'Instrument Sans', system-ui, sans-serif;
        color: #cfd6ff;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      #boot .ring {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 2px solid rgba(140, 160, 255, 0.18);
        border-top-color: #7c8cff;
        animation: bootspin 0.9s linear infinite;
      }
      #boot .lbl {
        font-size: 12px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        opacity: 0.62;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
      html[data-theme='phosphor'] #boot {
        color: #7dffa8;
        background: #02110a;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="ring"></div>
      <div class="lbl">Initialising engine</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove the splash once React has mounted.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var b = document.getElementById('boot');
          if (b) {
            b.style.opacity = '0';
            setTimeout(function () {
              b.remove();
            }, 520);
          }
        }, 260);
      });
    </script>
  </body>
</html>
